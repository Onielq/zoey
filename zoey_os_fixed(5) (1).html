/* FINAL HOME POLISH v2 — edge-to-edge workspace, proportional panels, freeform chat */
.home .home-scene{
  min-height:calc(100vh - 78px);
  height:calc(100vh - 78px);
  overflow:visible;
  isolation:isolate;
}
.home .home-scene:before{
  content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(circle at 50% 45%,transparent 42%,rgba(0,0,0,.30) 100%);
}
.mini-panel{
  border:1px solid rgba(255,255,255,.105);border-radius:var(--radius-md);
  background:linear-gradient(145deg,rgba(10,10,13,.84),rgba(6,6,9,.78));
  box-shadow:0 18px 45px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.012);
  backdrop-filter:blur(10px);
}
.calendar{
  left:clamp(4px,1vw,14px);top:clamp(8px,1.5vh,18px);
  width:clamp(220px,22vw,340px);
  padding:clamp(13px,1.2vw,18px);
  border-radius:var(--radius-md);
}
.calendar-top{font-size:clamp(10px,.7vw,12px)}
.calendar-top strong{font-size:clamp(11px,.8vw,13px)}
.week{gap:clamp(5px,.45vw,8px);margin-top:12px;font-size:clamp(8px,.55vw,10px)}
.dates{gap:clamp(6px,.55vw,9px);margin-top:8px;font-size:clamp(8px,.55vw,10px)}
.dates .sel{border-radius:var(--radius-sm);padding:clamp(4px,.35vw,6px) 0}
.cal-task{margin-top:14px;padding-top:10px;font-size:clamp(8px,.6vw,10px);line-height:1.6}

.tasklist{
  right:clamp(4px,1vw,14px);top:clamp(8px,1.5vh,18px);
  width:clamp(250px,25vw,360px);padding:14px;border-radius:var(--radius-md);
}
.recent-files{
  margin-top:9px;height:clamp(180px,27vh,290px);
  max-height:none;overflow-y:auto;overflow-x:hidden;padding-right:6px;
  scrollbar-width:thin;scrollbar-color:#393a42 transparent;
}
.recent-files::-webkit-scrollbar{width:7px}
.recent-files::-webkit-scrollbar-track{background:transparent}
.recent-files::-webkit-scrollbar-thumb{background:#34353d;border-radius:var(--radius-full)}
.recent-file{
  padding:9px 0;border-bottom:1px solid rgba(255,255,255,.065);
  font:clamp(9px,.62vw,11px)/1.35 var(--font-text);
  color:#d3d3d8;font-weight:700;
}
.recent-meta{font-size:clamp(7px,.52vw,9px);color:#777981;font-weight:500}
.file-icon{width:26px;height:26px;border-radius:var(--radius-sm);font-size:11px}
.file-actions{
  margin-top:9px;padding-top:9px;border-top:1px solid rgba(255,255,255,.07);
}
.show-more-btn{display:none !important}
.upload-btn{
  display:flex;align-items:center;justify-content:center;width:100%;min-height:42px;
  border:1px solid color-mix(in srgb,var(--accent,var(--color-accent)) 78%,white 22%);
  background:var(--accent,var(--color-accent));color:#111!important;
  border-radius:var(--radius-sm);padding:10px 12px;font:900 11px var(--font-text);
  letter-spacing:.11em;cursor:pointer;
  box-shadow:0 0 22px color-mix(in srgb,var(--accent,var(--color-accent)) 20%,transparent);
}
.upload-btn:hover{filter:brightness(1.06);transform:translateY(-1px);box-shadow:0 0 28px color-mix(in srgb,var(--accent,var(--color-accent)) 28%,transparent)}
.upload-btn:active{transform:translateY(0)}

.orb-area{z-index:1;inset:0!important;display:grid;place-items:center;pointer-events:none}
.orb-wrap{
  width:min(460px,42vw,52vh);position:relative;
  --orb-idle:var(--color-orb-thinking);--orb-listening:#39d9ff;--orb-thinking:#c07cff;--orb-speaking:var(--color-success);--orb-error:var(--color-danger);
}
.orb-glow{
  inset:-10%;filter:blur(62px);opacity:1;
  background:radial-gradient(circle,var(--orb-idle,rgba(94,157,255,.34)) 0%,rgba(79,112,255,.20) 28%,rgba(172,105,255,.10) 50%,transparent 73%);
  transform:scale(1.08);transition:background .35s ease,filter .35s ease;
}
.orb-wrap.state-idle .orb-glow{background:radial-gradient(circle,color-mix(in srgb,var(--orb-idle) 35%,transparent),transparent 70%)}
.orb-wrap.state-listening .orb-glow{background:radial-gradient(circle,color-mix(in srgb,var(--orb-listening) 38%,transparent),transparent 70%)}
.orb-wrap.state-thinking .orb-glow{background:radial-gradient(circle,color-mix(in srgb,var(--orb-thinking) 42%,transparent),transparent 70%)}
.orb-wrap.state-speaking .orb-glow{background:radial-gradient(circle,color-mix(in srgb,var(--orb-speaking) 40%,transparent),transparent 70%)}
.orb-wrap.state-error .orb-glow{background:radial-gradient(circle,color-mix(in srgb,var(--orb-error) 46%,transparent),transparent 70%)}
.zoey-voice-orb{z-index:1;pointer-events:auto;transition:filter .35s ease}
.orb-wrap.state-idle .zoey-voice-orb{filter:drop-shadow(0 0 18px color-mix(in srgb,var(--orb-idle) 40%,transparent))}
.orb-wrap.state-listening .zoey-voice-orb{filter:drop-shadow(0 0 22px color-mix(in srgb,var(--orb-listening) 55%,transparent)) hue-rotate(12deg)}
.orb-wrap.state-thinking .zoey-voice-orb{filter:drop-shadow(0 0 22px color-mix(in srgb,var(--orb-thinking) 55%,transparent)) hue-rotate(28deg)}
.orb-wrap.state-speaking .zoey-voice-orb{filter:drop-shadow(0 0 22px color-mix(in srgb,var(--orb-speaking) 50%,transparent)) hue-rotate(86deg)}
.orb-wrap.state-error .zoey-voice-orb{filter:drop-shadow(0 0 28px color-mix(in srgb,var(--orb-error) 65%,transparent)) hue-rotate(300deg)}
.orb-wrap.state-error::after{
  content:"";position:absolute;inset:-2%;border-radius:50%;
  border:1px solid color-mix(in srgb,var(--orb-error) 72%,transparent);
  box-shadow:0 0 36px color-mix(in srgb,var(--orb-error) 28%,transparent);
  animation:errorPulse 1.1s ease-in-out infinite alternate;pointer-events:none;z-index:2;
}
@keyframes errorPulse{from{opacity:.55;transform:scale(.985)}to{opacity:1;transform:scale(1.015)}}
.orb-caption{bottom:84px}
.orb-caption .name{font:900 11px var(--font-text);letter-spacing:.24em}

class VoiceOrb extends HTMLElement{
  constructor(){super();this._state=this.getAttribute('state')||'idle';this._recording=this.hasAttribute('recording');this._particles=0;this._raf=0;this._ctx=null;this._program=null;this._buffers={};this._analyser=null;this._source=null;this._ownedContext=null;this._bands=[0,0,0];this._targetBands=[0,0,0];this._onset=0;this._rendering=false;this._seed=[];this._resizeObserver=null}
  static get observedAttributes(){return ['state','particles','recording']}
  connectedCallback(){
    this.setAttribute('aria-label',`Voice orb — ${this._state}`);this.style.contain='layout paint';
    this._canvas=document.createElement('canvas');this._canvas.setAttribute('aria-hidden','true');this.appendChild(this._canvas);
    this._initGL();this._makePoints(this._requestedCount());this._resizeObserver=new ResizeObserver(()=>this._resize());this._resizeObserver.observe(this);
    this._resize();
    if(!this._recording) this._start();
  }
  disconnectedCallback(){this._stop();this._resizeObserver?.disconnect();this.disconnect()}
  attributeChangedCallback(name,oldV,newV){if(oldV===newV)return;if(name==='state'){this._state=newV||'idle';this.setAttribute('aria-label',`Voice orb — ${this._state}`)}if(name==='particles'&&this.isConnected)this._makePoints(this._requestedCount());if(name==='recording'){this._recording=this.hasAttribute('recording');this._recording?this._stop():this._start()}}
  get state(){return this._state} set state(v){this.setAttribute('state',v)}
  get audioContext(){return this._analyser?.context||this._ownedContext||null}
  get bands(){return this._bands.slice()}
  get recording(){return this._recording}
  set recording(v){v?this.setAttribute('recording',''):this.removeAttribute('recording')}
  _requestedCount(){const raw=parseInt(this.getAttribute('particles')||'',10);if(Number.isFinite(raw))return Math.max(200,Math.min(20000,raw));return matchMedia('(pointer: coarse)').matches?6000:12000}
  _initGL(){
    this._gl=this._canvas.getContext('webgl',{alpha:true,antialias:false,preserveDrawingBuffer:true})||this._canvas.getContext('experimental-webgl',{alpha:true,antialias:false,preserveDrawingBuffer:true});

function setOrbState(state){
  const allowed=['idle','listening','thinking','speaking','error'];
  state=allowed.includes(state)?state:'idle';
  const orb=document.getElementById('homeOrb'); if(!orb)return;
  orb.state=state;
  const wrap=orb.closest('.orb-wrap');
  if(wrap)wrap.classList.remove(...allowed.map(s=>'state-'+s)),wrap.classList.add('state-'+state);
  const label=wrap?.querySelector('.state');
  if(label)label.textContent={
    idle:'COMPANION · READY',
    listening:'LISTENING · HEARING',
    thinking:'THINKING · PROCESSING',
    speaking:'SPEAKING · RESPONDING',
    error:'ERROR · RECOVERY'
  }[state];
  const pill=document.querySelector('.voice-pill');
  if(pill){
    const colors={idle:'var(--orb-idle)',listening:'var(--orb-listening)',thinking:'var(--orb-thinking)',speaking:'var(--orb-speaking)',error:'var(--orb-error)'};
    const labels={idle:'VOICE · IDLE',listening:'VOICE · LISTENING',thinking:'VOICE · THINKING',speaking:'VOICE · SPEAKING',error:'VOICE · ERROR'};
    pill.textContent=labels[state];
    pill.style.color=colors[state];
  }
  window.zoeyVoiceState=state;
  document.dispatchEvent(new CustomEvent('zoey:voice-state',{detail:{state,orb}}));
}

    if(e.button!==0)return;
    const handle=e.target.closest('[data-resize]');
    const interactive=e.target.closest('button,input,textarea,select,a');
    if(!handle&&interactive)return;
    const b=bounds(),r=chat.getBoundingClientRect();
    chat.style.left=(r.left-b.left)+'px';chat.style.top=(r.top-b.top)+'px';
    sx=e.clientX;sy=e.clientY;sl=parseFloat(chat.style.left);st=parseFloat(chat.style.top);sw=r.width;sh=r.height;
    op=handle?handle.dataset.resize:'drag';chat.classList.toggle('dragging',op==='drag');
    chat.setPointerCapture?.(e.pointerId);e.preventDefault();e.stopPropagation();
  });
  chat.addEventListener('pointermove',e=>{
    if(!op)return;
    const b=bounds(),dx=e.clientX-sx,dy=e.clientY-sy,limit=64,minW=260,minH=150;
    let l=sl,t=st,w=sw,h=sh;
    const maxW=Math.max(minW,b.width+limit),maxH=Math.max(minH,b.height+limit);
    if(op==='drag'){l=sl+dx;t=st+dy;}
    else{
      if(op.includes('r'))w=Math.max(minW,Math.min(maxW,sw+dx));
      if(op.includes('b'))h=Math.max(minH,Math.min(maxH,sh+dy));
      if(op.includes('l')){const nw=Math.max(minW,Math.min(maxW,sw-dx));l=sl+(sw-nw);w=nw;}
      if(op.includes('t')){const nh=Math.max(minH,Math.min(maxH,sh-dy));t=st+(sh-nh);h=nh;}
    }
    if(op==='drag'){
      l=Math.max(-limit,Math.min(l,b.width-w+limit));t=Math.max(-limit,Math.min(t,b.height-h+limit));
      chat.style.left=l+'px';chat.style.top=t+'px';
    }else{
      const rightLimit=b.width+limit,bottomLimit=b.height+limit;
      if(l<-limit){w-=(-limit-l);l=-limit}
      if(t<-limit){h-=(-limit-t);t=-limit}
      if(l+w>rightLimit)w=rightLimit-l;
      if(t+h>bottomLimit)h=bottomLimit-t;
      chat.style.left=l+'px';chat.style.top=t+'px';chat.style.width=Math.max(minW,w)+'px';chat.style.height=Math.max(minH,h)+'px';
    }
  });
  const end=()=>{if(!op)return;op=null;chat.classList.remove('dragging');clamp();save()};
  chat.addEventListener('pointerup',end);chat.addEventListener('pointercancel',end);
  chat.querySelectorAll('[data-chat-tab]').forEach(b=>b.addEventListener('click',()=>setChatTab(b.dataset.chatTab)));
  document.getElementById('zoeyChatSend')?.addEventListener('click',sendChatMessage);
  document.getElementById('zoeyChatInput')?.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChatMessage()}});
  window.addEventListener('resize',()=>{if(document.getElementById('zoeyChat')){clamp();save()}});
}

async function testProvider(p){
  const result=document.getElementById('integrationResult'); if(!result)return;
  let endpoint=document.getElementById('providerEndpoint')?.value||p.endpoint;
  const key=document.getElementById('providerKey')?.value||window.zoeyConnections.providers[p.name]?.key||'';
  const voiceId=document.getElementById('voiceId')?.value?.trim()||window.zoeyConnections.providers[p.name]?.voiceId||'';
  if(p.name==='ElevenLabs'&&voiceId)endpoint=`https://api.elevenlabs.io/v1/voices/${encodeURIComponent(voiceId)}`;
  if(!endpoint){result.textContent='No test endpoint configured for this provider.';return}
  result.textContent='Testing…';
  try{
    const headers={'Accept':'application/json'};
    if(key)headers.Authorization=`Bearer ${key}`;
    if(p.name==='ElevenLabs'&&key){delete headers.Authorization;headers['xi-api-key']=key;}
    const r=await fetch(endpoint,{headers,mode:'cors'});
    if(!r.ok)throw new Error(`${r.status} ${r.statusText}`);
    result.textContent=p.name==='ElevenLabs'?'Voice/API test succeeded.':'Connection test succeeded.';
  }catch(err){
    result.textContent=`Test failed or was blocked by browser CORS: ${err.message}`;
  }
}

function startOAuth(p){
  const out=document.getElementById('integrationResult');
  const provider=String(p?.provider||p?.name||'').toLowerCase();
  if(provider!=='google'){ if(out)out.textContent='This provider does not have a configured sign-in flow yet.'; return; }
  const base=(typeof backendBase==='function'?backendBase():'').replace(/\/+$/,'');
  if(!base){if(out)out.textContent='Google sign-in backend is not configured.';return}
  const returnOrigin=location.origin==='null'?'*':location.origin;
  const w=window.open(base+`/oauth/google/start?popup=1&return_origin=${encodeURIComponent(returnOrigin)}`,'zoey-google-oauth','width=520,height=720');
  if(!w){if(out)out.textContent='Popup blocked. Allow popups for Zoey and try again.';return}
  if(out)out.textContent='Google sign-in opened. Finish authorization in the Google window.';
}

});

document.addEventListener('keydown',e=>{

});

document.addEventListener('click',e=>{

function render(view='home'){
  document.getElementById('content').innerHTML=(views[view]||home)();
  installVoiceRuntime();
  document.querySelectorAll('#nav button[data-view], .bottom-btn[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));
  window.currentView=view;
  document.getElementById('modalHost').innerHTML='';
  if(view==='home'){
    setTimeout(()=>{
      installOrbControls();installChatInteractions();setOrbState('idle');renderCalendar();restoreUtilityDefault();syncUtilityButtons();
    },30);
  }
  if(view==='library')setTimeout(()=>installLibraryInteractions(),20);
  refreshConnectionUI();refreshIntegrationUI();
}

document.addEventListener('click',e=>{
  const utility=e.target.closest('[data-utility]');
  if(utility){openUtility(utility.dataset.utility);return}
  if(e.target.closest('#openLibraryBtn')){focusLibrary();return}
  if(e.target.closest('#uploadFileBtn')){document.getElementById('homeFileInput')?.click();return}
  if(e.target.closest('[data-open-connections]')){
    const n=e.target.closest('[data-open-connections]').dataset.openConnections;
    document.getElementById('modalHost').innerHTML='';history.pushState({},'','?view=connections');render('connections');setTimeout(()=>openIntegration(n),30);return
  }
  if(e.target.closest('[data-open-connection]')){openIntegration(e.target.closest('[data-open-connection]').dataset.openConnection);return}
  const filter=e.target.closest('[data-library-filter]');
  if(filter){libraryFilter=filter.dataset.libraryFilter;render('library');return}
  const v=e.target.closest('#nav button[data-view], .bottom-btn[data-view], [data-view-direct]');
  if(v){
    const view=v.dataset.view||v.dataset.viewDirect;
    if(view==='plugins'||view==='connections')return; // canonical control-plane router owns these surfaces
    history.pushState({},'',`?view=${view}`);render(view);return
  }
  if(e.target.closest('[data-chat-view="builder"]')){history.pushState({},'','?view=builder');render('builder');return}
  if(e.target.closest('#createAutomation')){openAutomation(0);return}
  const ed=e.target.closest('[data-edit-auto]');if(ed){openAutomation(Number(ed.dataset.editAuto));return}
  if(e.target.closest('[data-delete-auto]')){if(!window.confirm('Delete this workflow? This can’t be undone.'))return;e.target.closest('.auto-card')?.remove();pushActivity('WORKFLOW','Workflow removed from the active workspace.');return}
  if(e.target.closest('[data-close-modal]')){document.getElementById('modalHost').innerHTML='';return}
  if(e.target.id==='autoModal'||e.target.id==='integrationModal'){document.getElementById('modalHost').innerHTML='';return}
  if(e.target.closest('[data-open-inspector]')){const ins=document.querySelector('.inspector');if(ins)ins.style.display='block';return}
  if(e.target.id==='closeInspector'){const ins=document.querySelector('.inspector');if(ins)ins.style.display='none';return}
  if(e.target.closest('.mode')){const modes=[...document.querySelectorAll('.mode')];modes.forEach(x=>x.classList.remove('active'));e.target.closest('.mode').classList.add('active');return}
  if(e.target.closest('.app-tile')){document.querySelectorAll('.app-tile').forEach(x=>x.classList.remove('selected'));e.target.closest('.app-tile').classList.add('selected');return}
});
function renderUploadedFile(f){
  const ext=(f.name.split('.').pop()||'FILE').slice(0,4).toUpperCase();
  return {name:f.name,type:ext,owner:'You',time:'Just uploaded',path:`/uploads/${f.name}`,context:'My Files'};
}
document.addEventListener('change',e=>{
  if(e.target.id!=='homeFileInput' || !e.target.files?.length)return;
  const recent=document.getElementById('recentFilesList');
  if(!recent)return;
  const uploaded=[...e.target.files].slice(0,7).map(renderUploadedFile);
  uploaded.reverse().forEach(f=>{

    row.innerHTML=`<span class="file-icon">${escapeHtml(f.type)}</span><span><b>${escapeHtml(f.name)}</b><span class="meta">${escapeHtml(f.owner)} · ${escapeHtml(f.time)}</span><span class="meta">${escapeHtml(f.path)}</span></span>`;
    recent.prepend(row);
  });
  const count=document.getElementById('recentCount');if(count)count.textContent=recent.children.length;
  pushActivity('FILE UPLOADED',`${uploaded.length} file${uploaded.length===1?'':'s'} added to Recent Files.`);
  openUtility('recent');
  e.target.value='';
});

}

<script id="zoey-final-system-runtime">
/* ===== ZOEY SYSTEM RUNTIME ===== */
(() => {
  const esc = s => String(s ?? '').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));
  const state = window.zoeySettings || (window.zoeySettings = {
    accent:'#ff6b16',
    orb:{idle:'#c07cff',listening:'#39d9ff',thinking:'#ffb020',speaking:'#ff4e92',error:'#ff4e63'},
    backendUrl:'',
    defaultUtility:'none',
    routing:{primary:'OpenAI',fallback:'Google Gemini',voice:'ElevenLabs'}
  });
  window.zoeyConnections = window.zoeyConnections || {providers:{}, accounts:{}};

  /* ----- Orange migration: preserve user-chosen colors, but remove accidental legacy yellow defaults. ----- */
  const savedMeta = (()=>{try{return JSON.parse(localStorage.getItem('zoeySettingsMeta')||'null')}catch{return null}})();
  const legacyYellow = /^#(?:ffb020|ffd27a|f6a700|ffbf00|ffe01b|facc15)$/i;
  if (!savedMeta?.accent || legacyYellow.test(savedMeta.accent)) {
    state.accent = '#ff6b16';
    try { localStorage.setItem('zoeySettingsMeta', JSON.stringify({...savedMeta,...state, accent:'#ff6b16', version:3})); } catch {}
  }
  document.documentElement.style.setProperty('--accent', state.accent || '#ff6b16');
  document.documentElement.style.setProperty('--color-accent', state.accent || '#ff6b16');

  /* ----- Persistent utility windows: opening one NEVER closes another. ----- */
  const WINDOW_KEY='zoeyUtilityStateV3';
  let zCounter = Number(localStorage.getItem('zoeyWindowZ')||60);
  const utilId = k => ({calendar:'calendarPanel',recent:'recentFilesPanel',chat:'zoeyChat'}[k]);
  const getUtilityPanels = () => Object.fromEntries(Object.entries({
    calendar:document.getElementById('calendarPanel'),
    recent:document.getElementById('recentFilesPanel'),
    chat:document.getElementById('zoeyChat')
  }).filter(([,v])=>!!v));
  const saveUtilityStateV3 = () => {
    const p=getUtilityPanels();
    const snapshot={};
    for(const [k,el] of Object.entries(p)){
      snapshot[k]={open:!el.classList.contains('is-hidden'),z:Number(el.style.getPropertyValue('--zoey-window-z'))||35};
    }
    try{localStorage.setItem(WINDOW_KEY,JSON.stringify(snapshot));localStorage.setItem('zoeyWindowZ',String(zCounter));}catch{}
  };
  const focusUtility = (kind) => {
    const el=getUtilityPanels()[kind]; if(!el)return;
    zCounter += 1;
    el.style.setProperty('--zoey-window-z',zCounter);
    Object.values(getUtilityPanels()).forEach(x=>x.classList.remove('is-focused'));
    el.classList.add('is-focused');
    saveUtilityStateV3();
  };
  const closeUtility = kind => {
    const el=getUtilityPanels()[kind]; if(!el)return;
    el.classList.add('is-hidden');
    el.classList.remove('is-focused');
    const btn=document.querySelector(`.utility-nav [data-utility="${kind}"]`);
    btn?.classList.remove('is-open');
    saveUtilityStateV3();
  };
  window.closeUtility = closeUtility;
  window.openUtility = function(kind){
    if(window.currentView!=='home'){
      history.pushState({},'', '?view=home');
      window.render?.('home');
      setTimeout(()=>window.openUtility(kind),40);
      return;
    }
    const el=getUtilityPanels()[kind]; if(!el)return;
    const hidden=el.classList.contains('is-hidden');
    if(hidden){
      el.classList.remove('is-hidden');
      focusUtility(kind);
      document.querySelector(`.utility-nav [data-utility="${kind}"]`)?.classList.add('is-open');
      if(kind==='calendar') window.renderCalendar?.();
      if(kind==='chat'){
        try{setChatTab(localStorage.getItem('zoeyChatTab')||'zoe')}catch{setChatTab('zoe')}
        installChatInteractions();
      }
    }else{
      closeUtility(kind);
    }
  };
  window.closeUtilities = function(){ /* compatibility only; intentionally does not close siblings. */ };
  window.restoreUtilityDefault = function(){
    let k='none';
    try{k=window.zoeySettings?.defaultUtility||'none'}catch{}
    if(k!=='none') setTimeout(()=>window.openUtility(k),40);
  };
  window.saveUtilityState = saveUtilityStateV3;

  /* When the user clicks anywhere inside a utility, bring only that window forward. */
  document.addEventListener('pointerdown', e=>{
    const panel=e.target.closest('.utility-panel');
    if(panel){
      const kind=Object.keys(getUtilityPanels()).find(k=>getUtilityPanels()[k]===panel);
      if(kind)focusUtility(kind);
    }
  }, true);

  /* Add explicit close buttons and restore persisted open states after home renders. */
  function decorateUtilityPanels(){
    const calendar=document.getElementById('calendarPanel');
    const recent=document.getElementById('recentFilesPanel');
    const chat=document.getElementById('zoeyChat');
    if(calendar && !calendar.querySelector('.utility-close')){
      calendar.insertAdjacentHTML('afterbegin','<div class="utility-title-row"><strong style="font:800 10px var(--font-mono);letter-spacing:.14em;color:#b2b3ba">CALENDAR</strong><button class="utility-close" data-utility-close="calendar" aria-label="Close Calendar">×</button></div>');
    }
    if(recent && !recent.querySelector('.utility-close')){
      const head=recent.querySelector('.panel-title');
      if(head){
        const close=document.createElement('button');
        close.className='utility-close';close.type='button';close.dataset.utilityClose='recent';close.setAttribute('aria-label','Close Recent Files');close.textContent='×';
        head.appendChild(close);
      }
    }
    if(chat && !chat.querySelector('.utility-close')){
      const tabs=chat.querySelector('.chat-tabs');
      if(tabs){
        const close=document.createElement('button');
        close.className='utility-close';close.type='button';close.dataset.utilityClose='chat';close.setAttribute('aria-label','Close Zoe Chat');close.textContent='×';
        tabs.appendChild(close);
      }
    }
    if(calendar){
      calendar.addEventListener('click',e=>{const b=e.target.closest('[data-utility-close]');if(b)closeUtility(b.dataset.utilityClose)}, {once:false});
    }
    if(recent){
      recent.addEventListener('click',e=>{const b=e.target.closest('[data-utility-close]');if(b)closeUtility(b.dataset.utilityClose)}, {once:false});
    }
    if(chat){
      chat.addEventListener('click',e=>{const b=e.target.closest('[data-utility-close]');if(b)closeUtility(b.dataset.utilityClose)}, {once:false});
    }
    let saved=null;try{saved=JSON.parse(localStorage.getItem(WINDOW_KEY)||'null')}catch{}
    if(saved){
      for(const [k,v] of Object.entries(saved)){
        const el=getUtilityPanels()[k];
        if(el && v?.open){
          el.classList.remove('is-hidden');
          el.style.setProperty('--zoey-window-z',Number(v.z)||++zCounter);
          document.querySelector(`.utility-nav [data-utility="${k}"]`)?.classList.add('is-open');
        }
      }
    }
  }

  /* ----- Managed backend / API bridge. UI never sends secrets cross-origin directly. ----- */
  const ZOEY_SESSION_KEY='zoeyBackendSession';
  function getBackendSession(){try{return sessionStorage.getItem(ZOEY_SESSION_KEY)||localStorage.getItem(ZOEY_SESSION_KEY)||''}catch{return ''}}
  function setBackendSession(id){if(!id)return;try{sessionStorage.setItem(ZOEY_SESSION_KEY,id);localStorage.setItem(ZOEY_SESSION_KEY,id)}catch{}}
  async function captureBackendSession(res){const id=res.headers.get('X-Zoey-Session');if(id)setBackendSession(id)}
  function backendBase(){
    const configured=String(window.zoeySettings?.backendUrl||'').trim().replace(/\/+$/,'');
    if(configured)return configured;
    if(location.protocol==='file:')return 'http://localhost:8787/api';
    return location.origin + '/api';
  }
  function apiError(res,data){
    const msg=data?.error || data?.message || `${res.status} ${res.statusText}`;
    return new Error(msg);
  }
  async function backendFetch(path, options={}){
    const base=backendBase();
    if(!base) throw new Error('Secure backend is not configured. Set the Backend Base URL in Settings.');
    const sessionId=getBackendSession();
    const res=await fetch(base + path, {
      credentials:'include',
      ...options,
      headers:{'Accept':'application/json', ...(options.body?{'Content-Type':'application/json'}:{}), ...(sessionId?{'X-Zoey-Session':sessionId}:{}), ...(options.headers||{})}
    });
    await captureBackendSession(res);
    let data=null;
    const ct=res.headers.get('content-type')||'';
    if(ct.includes('application/json')) data=await res.json().catch(()=>null);
    if(!res.ok) throw apiError(res,data);
    return data ?? {};
  }
  window.zoeyAPI = {
    backendBase,
    health:()=>backendFetch('/health'),
    saveConnection:(provider,payload)=>backendFetch('/connections/save',{method:'POST',body:JSON.stringify({provider,...payload})}),
    testProvider:(provider,payload)=>backendFetch('/providers/test',{method:'POST',body:JSON.stringify({provider,...payload})}),
    calendarToday:()=>backendFetch('/calendar/today'),
    createCalendarEvent:payload=>backendFetch('/calendar/events',{method:'POST',body:JSON.stringify(payload)}),
    chat:payload=>backendFetch('/zoey/chat',{method:'POST',body:JSON.stringify(payload)}),
  };

  /* ----- Provider catalog: API connections are key-only; OAuth is provider-sign-in only. ----- */
  const cat = [
    {name:'OpenAI',cat:'Model',auth:'api',key:'OPENAI_API_KEY',description:'Model inference and agent orchestration.'},
    {name:'Google Gemini',cat:'Model',auth:'api',key:'GEMINI_API_KEY',description:'Google generative AI fallback/model routing.'},
    {name:'ElevenLabs',cat:'Voice',auth:'api',key:'ELEVENLABS_API_KEY',description:'Speech synthesis for Zoey voice.'},
    {name:'Anthropic / Claude',cat:'Model',auth:'api',key:'ANTHROPIC_API_KEY',description:'Claude model provider.'},
    {name:'DeepSeek',cat:'Model',auth:'api',key:'DEEPSEEK_API_KEY',description:'Deep reasoning/chat models.'},
    {name:'Mistral',cat:'Model',auth:'api',key:'MISTRAL_API_KEY',description:'Mistral model family.'},
    {name:'Groq',cat:'Model',auth:'api',key:'GROQ_API_KEY',description:'Low-latency inference.'},
    {name:'xAI / Grok',cat:'Model',auth:'api',key:'XAI_API_KEY',description:'Grok model provider.'},
    {name:'OpenRouter',cat:'Model',auth:'api',key:'OPENROUTER_API_KEY',description:'Multi-provider routing.'},
    {name:'Tavily',cat:'Research',auth:'api',key:'TAVILY_API_KEY',description:'Research search.'},
    {name:'Firecrawl',cat:'Research',auth:'api',key:'FIRECRAWL_API_KEY',description:'Web extraction.'},
    {name:'Supabase',cat:'Developer',auth:'api',key:'SUPABASE_SERVICE_KEY',description:'Database, storage, edge functions.'},
    {name:'Google Workspace',cat:'Productivity',auth:'oauth',provider:'google',description:'One Google account connection for Gmail, Drive, Calendar, Docs and meetings.'},

    {name:'Gmail',cat:'Communication',auth:'oauth',provider:'google',alias:'Google Workspace',description:'Mail surface using the connected Google account.'},

    const p=canonicalProvider(name);
    if(p?.auth==='oauth') return !!window.zoeyConnections.accounts[p.provider||p.name]?.connected;

        const p=e.data.provider||'google';
        window.zoeyConnections.accounts[p]={connected:true,email:e.data.email||'',services:e.data.services||[]};
        pushActivity('ACCOUNT CONNECTED',`${e.data.email||'Account'} is connected to ${p}.`);

  /* ----- Settings: backend is explicit, accent stays orange unless user deliberately changes it. ----- */
  window.settings = function(){

          <div class="credential-routing"><div class="credential-card"><b>PRIMARY</b><strong>OpenAI</strong><span>Workspace foundation and orchestration.</span></div><div class="credential-card"><b>FALLBACK</b><strong>Google Gemini</strong><span>Alternative model route.</span></div><div class="credential-card"><b>VOICE</b><strong>ElevenLabs</strong><span>TTS through secure backend.</span></div></div>

          ${[['idle','IDLE · LILAC'],['listening','LISTENING'],['thinking','THINKING'],['speaking','SPEAKING'],['error','ERROR · RED']].map(([k,l])=>`<div class="settings-row color-setting"><div><b>${l}</b><span>Live state color for the Voice Orb.</span></div><input class="orbColor" data-orb-color="${k}" type="color" value="${esc(s.orb[k])}"></div>`).join('')}

  }

  /* ----- Voice runtime: real microphone + recognition when supported, with orb audio hookup. ----- */
  window.zoeyVoiceRuntime = window.zoeyVoiceRuntime || {};
  const VR=window.zoeyVoiceRuntime;
  VR.recognition=null;VR.stream=null;VR.voiceActive=false;
  async function startListening(){
    const orb=document.getElementById('homeOrb');
    if(!orb)return;
    setOrbState('listening');
    try{
      if(!VR.stream){
        VR.stream=await navigator.mediaDevices.getUserMedia({audio:true});
        await orb.connect(VR.stream);
      }
      const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;
      if(Recognition){
        if(VR.recognition)try{VR.recognition.abort()}catch{}
        const rec=new Recognition();rec.lang=navigator.language||'en-US';rec.interimResults=true;rec.continuous=false;
        rec.onresult=e=>{
          const transcript=[...e.results].map(r=>r[0].transcript).join(' ').trim();
          if(transcript){appendChatMessage('You',transcript,'user');routeZoeyMessage(transcript,true)}
        };
        rec.onerror=()=>{
          setOrbState('error');setTimeout(()=>setOrbState('idle'),900);
        };
        rec.onend=()=>{if(window.zoeyVoiceState==='listening')setOrbState('thinking')};
        VR.recognition=rec;rec.start();
      }else{
        appendChatMessage('Voice','Speech recognition is not available in this browser. Microphone audio is still connected to the Orb.','route');
        setTimeout(()=>setOrbState('idle'),1000);
      }
    }catch(err){
      setOrbState('error');pushActivity('VOICE',`Microphone unavailable: ${err.message}`);setTimeout(()=>setOrbState('idle'),1300);
    }
  }
  function stopListening(){try{VR.recognition?.stop()}catch{}}
  async function speakZoey(text){
    if(!text)return;
    setOrbState('speaking');
    try{
      const voice=window.zoeyConnections.providers.ElevenLabs;
      if(voice?.configured){
        const data=await window.zoeyAPI.chat({mode:'tts',text,provider:'ElevenLabs',voiceId:voice.voiceId||''});
        if(data?.audioUrl){
          const audio=new Audio(data.audioUrl);audio.preload='auto';
          audio.onended=()=>setOrbState('idle');
          try{await document.getElementById('homeOrb')?.connect(audio)}catch{}
          await audio.play();
          return;
        }
      }
    }catch(err){
      if(voice?.configured){
        appendChatMessage('Voice',`ElevenLabs could not speak: ${err.message}`,'route');
        pushActivity('VOICE',`ElevenLabs TTS failed: ${err.message}`);
        setOrbState('error');setTimeout(()=>setOrbState('idle'),1200);
        return;
      }
    }
    if('speechSynthesis' in window){
      const u=new SpeechSynthesisUtterance(text);u.onend=()=>setOrbState('idle');u.onerror=()=>setOrbState('idle');speechSynthesis.cancel();speechSynthesis.speak(u);
    }else setTimeout(()=>setOrbState('idle'),1400);
  }
  async function routeZoeyMessage(value,voice=false){
    setOrbState('thinking');
    let answer='';
    try{
      const data=await window.zoeyAPI.chat({message:value,voice});
      answer=data.answer||data.text||'I received the request.';
    }catch(err){
      const detail=err?.message||'Backend request failed.';
      answer=`Model routing failed: ${detail}`;
      pushActivity('MODEL ERROR',detail);
    }
    appendChatMessage('Zoey',answer,'route');
    if(voice && answer.startsWith('Model routing failed:')){setOrbState('error');setTimeout(()=>setOrbState('idle'),1400);return}
    if(voice)await speakZoey(answer); else setOrbState('idle');
  }
  window.startZoeyListening=startListening;
  window.stopZoeyListening=stopListening;

  /* Final voice lifecycle patch: microphone context is resumed from the user gesture,
     the orb analyses an AudioNode, and stopping releases recognition + tracks + context. */
  async function startListeningFinal(){
    const orb=document.getElementById('homeOrb');
    if(!orb)return;
    setOrbState('listening');
    try{
      VR.micContext ??= new AudioContext();
      await VR.micContext.resume();
      VR.stream=VR.stream || await navigator.mediaDevices.getUserMedia({audio:true});
      await orb.connect(VR.micContext.createMediaStreamSource(VR.stream));
      const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;
      if(!Recognition){
        appendChatMessage('Voice','Speech recognition is not available in this browser. Microphone audio is still connected to the Orb.','route');
        return;
      }
      try{VR.recognition?.abort()}catch{}
      const rec=new Recognition();
      rec.lang=navigator.language||'en-US';rec.interimResults=true;rec.continuous=false;
      rec.onresult=e=>{
        const transcript=[...e.results].map(r=>r[0].transcript).join(' ').trim();
        if(transcript){appendChatMessage('You',transcript,'user');routeZoeyMessage(transcript,true)}
      };
      rec.onerror=()=>{setOrbState('error');setTimeout(()=>setOrbState('idle'),900)};
      rec.onend=()=>{if(window.zoeyVoiceState==='listening')setOrbState('thinking')};
      VR.recognition=rec;rec.start();
    }catch(err){
      setOrbState('error');pushActivity('VOICE',`Microphone unavailable: ${err.message}`);
      setTimeout(()=>setOrbState('idle'),1300);
    }
  }
  function stopListeningFinal(){
    try{VR.recognition?.stop()}catch{}
    VR.recognition=null;
    const orb=document.getElementById('homeOrb');
    try{orb?.disconnect()}catch{}
    try{VR.stream?.getTracks().forEach(track=>track.stop())}catch{}
    VR.stream=null;
    try{VR.micContext?.close()}catch{}
    VR.micContext=null;
    setOrbState('idle');
  }
  startListening=startListeningFinal;
  stopListening=stopListeningFinal;
  window.startZoeyListening=startListeningFinal;
  window.stopZoeyListening=stopListeningFinal;

  /* HTMLMediaElement -> Voice Orb must still reach the speaker output while also driving the analyser. */
  if(window.VoiceOrb && !window.__zoeyOrbMediaOutputPatch){
    window.__zoeyOrbMediaOutputPatch=true;
    const originalConnect=VoiceOrb.prototype.connect;
    VoiceOrb.prototype.connect=async function(source){
      const result=await originalConnect.call(this,source);
      if(source instanceof HTMLMediaElement && this._analyser && this._ownedContext){
        try{this._analyser.connect(this._ownedContext.destination)}catch{}
      }
      return result;
    };
  }

  /* Replace the old spacebar demo with actual voice lifecycle. */
  if(!window.__zoeyVoiceFinalBound){
    window.__zoeyVoiceFinalBound=true;
    window.addEventListener('keydown',e=>{
      if(window.__zoeyVoiceAgentController)return;
      if(!(e.ctrlKey&&e.code==='Space')||e.repeat||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;
      e.preventDefault(); window.startZoeyListening?.();
    },true);
  }
  window.installVoiceRuntime = function(){ /* authoritative voice controller owns runtime */ };

  /* ----- Make chat send use the actual backend when available. ----- */
  window.sendChatMessage = async function(){
    const input=document.getElementById('zoeyChatInput');if(!input)return;
    const value=input.value.trim();if(!value)return;
    appendChatMessage('You',value,'user');input.value='';
    pushActivity('ZOEY',`Routing request to Zoey.`);
    await routeZoeyMessage(value,false);
  };

  /* ----- Import skill file into the registry as a browser-local definition. ----- */
  document.addEventListener('change',e=>{
    if(e.target.id!=='skillFileInput'||!e.target.files?.[0])return;
    const f=e.target.files[0];
    const reader=new FileReader();
    reader.onload=()=>{
      const item={name:f.name.replace(/\.[^.]+$/,''),origin:'IMPORTED',owner:'User',desc:String(reader.result||'').slice(0,180)};
      try{const arr=JSON.parse(localStorage.getItem('zoeySkills')||'[]');arr.unshift(item);localStorage.setItem('zoeySkills',JSON.stringify(arr))}catch{}
      pushActivity('SKILL IMPORTED',`${f.name} is available to Builder.`);
      e.target.value='';
    };
    reader.readAsText(f);
  });

  /* ----- Event delegation: connections, integrations, settings, navigation. ----- */
  document.addEventListener('click',e=>{
    const utilityClose=e.target.closest('[data-utility-close]');
    if(utilityClose){closeUtility(utilityClose.dataset.utilityClose);return}
    const card=e.target.closest('[data-provider-name]');
    if(card){window.openIntegration(card.dataset.providerName);return}
    const app=e.target.closest('[data-real-integration]');
    if(app){
      const aliases={'Gmail':'Google Workspace','Google Calendar':'Google Workspace','Google Drive':'Google Workspace','Google Docs':'Google Workspace'};
      window.openIntegration(aliases[app.dataset.realIntegration]||app.dataset.realIntegration);return;
    }
    if(e.target.id==='importSkillBtn'){document.getElementById('skillFileInput')?.click();return}
    if(e.target.id==='testBackend'){
      const r=document.getElementById('backendResult');if(!r)return;
      r.textContent='Checking…';window.zoeyAPI.health().then(()=>r.textContent='Backend reachable. Secure proxy is online.').catch(err=>r.textContent=`Backend not reachable: ${err.message}`);return;
    }
    if(e.target.id==='saveSettings'){
      const s=window.zoeySettings;
      const accent=document.getElementById('accentPicker')?.value||'#ff6b16';
      s.accent=accent;s.backendUrl=document.getElementById('backendUrl')?.value?.trim()||'';
      s.defaultUtility=document.getElementById('defaultUtility')?.value||'none';
      document.querySelectorAll('.orbColor').forEach(i=>s.orb[i.dataset.orbColor]=i.value);
      try{localStorage.setItem('zoeySettingsMeta',JSON.stringify({...s,version:3}))}catch{}
      document.documentElement.style.setProperty('--accent',s.accent);
      document.documentElement.style.setProperty('--color-accent',s.accent);
      setOrbState(window.zoeyVoiceState||'idle');pushActivity('SETTINGS','Workspace settings saved.');return;
    }
    if(e.target.id==='testVoiceFlow'){
      startListening();
      setTimeout(()=>{setOrbState('thinking');setTimeout(()=>speakZoey('Voice flow test complete.'),550)},850);
      return;
    }
    if(e.target.id==='newBuilderWorkflow'){openAutomation(0);return}
  }, true);

  /* ----- Rebind page map and augment old views without removing legacy pages. ----- */
  try{
    views.home=window.home;
    views.connections=window.connections;
    views.integrations=window.integrationsPage;
    views.builder=window.builder;
    views.skills=window.skills;
    views.tools=window.tools;
    views.settings=window.settings;
  }catch{}

  /* On page render, decorate home utilities and refresh connection state. */
  const oldRender=window.render;
  if(typeof oldRender==='function'){
    window.render = function(view='home'){
      oldRender(view);
      if(view==='home')setTimeout(()=>{decorateUtilityPanels();window.refreshConnectionUI();},40);
      else window.refreshConnectionUI();
    };
  }

  /* Patch the current view after all overrides are installed. */
  setTimeout(()=>{
    const q=new URLSearchParams(location.search);window.render?.(q.get('view')||'home');hydrateConnectionsFromBackend();
  },0);

})();
</script>

<script id="zoey-canonical-router">
/* Canonical capture router.  It runs at window capture, before legacy document listeners.
   This prevents older delegated handlers from rendering a page or closing a utility first. */
(function(){
  if(window.__zoeyCanonicalRouterInstalled)return;
  window.__zoeyCanonicalRouterInstalled=true;
  const aliases={Gmail:'Google Workspace','Google Calendar':'Google Workspace','Google Drive':'Google Workspace','Google Docs':'Google Workspace',Gemini:'Google Gemini',Claude:'Anthropic / Claude'};
  function route(view){
    if(!view || typeof window.render!=='function')return;
    if(window.currentView===view){
      document.querySelectorAll('#nav button[data-view], .bottom-stack button[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));
      return;
    }
    history.pushState({},'',`?view=${encodeURIComponent(view)}`);
    window.render(view);
  }
  window.addEventListener('click',function(e){
    const nav=e.target.closest?.('#nav button[data-view], .bottom-stack button[data-view]');
    if(nav){
      const view=nav.dataset.view;
      if(view==='plugins'||view==='connections')return; // leave these to the final control plane below
      e.preventDefault();
      e.stopImmediatePropagation();
      route(view);
      return;
    }
    const utility=e.target.closest?.('.utility-nav [data-utility]');
    if(utility){
      e.preventDefault();
      e.stopImmediatePropagation();
      window.openUtility?.(utility.dataset.utility);
      return;
    }
    const provider=e.target.closest?.('[data-provider-name]');
    if(provider){
      e.preventDefault();
      e.stopImmediatePropagation();
      window.openIntegration?.(provider.dataset.providerName);
      return;
    }
    const integration=e.target.closest?.('[data-real-integration]');
    if(integration){
      e.preventDefault();
      e.stopImmediatePropagation();
      window.openIntegration?.(aliases[integration.dataset.realIntegration]||integration.dataset.realIntegration);
      return;
    }
  },true);
})();
</script>

<script>
/* FINAL CLICK ROUTER: bypasses the legacy document listeners for the two critical navigation areas. */
(function(){
  function routeView(view){
    history.pushState({},'',`?view=${view}`);
    if(typeof window.render==='function')window.render(view);
  }
  function bind(){
    document.querySelectorAll('#nav button[data-view], .bottom-stack button[data-view]').forEach(btn=>{
      if(btn.dataset.finalBound==='1')return;
      btn.dataset.finalBound='1';
      btn.addEventListener('click',e=>{
        const view=btn.dataset.view;
        if(view==='plugins'||view==='connections')return; // canonical control-plane router below owns these
        e.preventDefault();e.stopPropagation();routeView(view)
      },true);
    });
    document.querySelectorAll('[data-provider-name], [data-real-integration]').forEach(btn=>{
      if(btn.dataset.finalBound==='1')return;
      btn.dataset.finalBound='1';
      btn.addEventListener('click',e=>{
        e.preventDefault();e.stopPropagation();
        const alias={Gmail:'Google Workspace','Google Calendar':'Google Workspace','Google Drive':'Google Workspace','Google Docs':'Google Workspace'};
        const name=btn.dataset.providerName||alias[btn.dataset.realIntegration]||btn.dataset.realIntegration;
        window.openIntegration?.(name);
      },true);
    });
  }
  bind();
  new MutationObserver(bind).observe(document.body,{childList:true,subtree:true});
})();
</script>
