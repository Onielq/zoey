.final-provider-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.final-provider-mark{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:#151519;border:1px solid rgba(255,255,255,.08);font-weight:800;font-size:11px}
.final-provider-name{font-weight:750;font-size:12px;line-height:1.2}.final-provider-meta{color:#7c7d85;font-size:10px;margin-top:3px}.final-provider-state{font:800 9px var(--font-mono);letter-spacing:.11em;color:#777980}.final-provider-card.connected .final-provider-state{color:var(--green)}
.final-plugin-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.final-plugin-tile{appearance:none;min-height:126px;border:1px solid rgba(255,255,255,.09);background:#0a0a0e;border-radius:13px;color:#ddd;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;transition:.16s ease}
.final-plugin-tile:hover{border-color:rgba(255,255,255,.23);transform:translateY(-1px)}.final-plugin-tile.connected{border-color:color-mix(in srgb,var(--accent) 55%,transparent);box-shadow:0 0 20px color-mix(in srgb,var(--accent) 10%,transparent)}
.final-plugin-logo{width:42px;height:42px;border-radius:11px;background:#151519;border:1px solid rgba(255,255,255,.08);display:grid;place-items:center;font-weight:800}.final-plugin-name{font-size:11px;text-align:center}.final-plugin-state{font:800 9px var(--font-mono);letter-spacing:.10em;color:#777980}.final-plugin-tile.connected .final-plugin-state{color:var(--green)}
.final-bridge{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}.final-bridge-side{border:1px solid rgba(255,255,255,.09);background:#0b0b0f;border-radius:13px;padding:13px}.final-bridge-title{font:800 9px var(--font-mono);letter-spacing:.14em;color:#888990}.final-bridge-value{font-weight:800;font-size:16px;margin-top:8px}.final-bridge-copy{font-size:10px;line-height:1.55;color:#7d7e86;margin-top:5px}.final-bridge-arrow{color:var(--accent);font-size:20px}
.final-modal .modal{width:min(640px,calc(100vw - 32px));max-height:min(82vh,760px);overflow:auto}.final-modal .field input{height:40px}.final-modal .field textarea{min-height:96px}.final-modal .hint{font-size:10px;line-height:1.6;color:#767780}.final-modal .result{margin-top:10px;padding:9px 10px;border:1px solid rgba(255,255,255,.08);border-radius:9px;background:#0a0a0d;color:#a6a7ae;font-size:10px;min-height:18px}.final-modal .result.ok{border-color:rgba(56,220,158,.18);color:#63e0af}.final-modal .result.err{border-color:rgba(255,78,99,.18);color:#ff8f9b}
@media(max-width:1020px){.final-provider-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.final-plugin-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.final-control-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.final-provider-grid,.final-plugin-grid,.final-control-grid{grid-template-columns:1fr}.final-bridge{grid-template-columns:1fr}.final-bridge-arrow{transform:rotate(90deg);justify-self:center}}
</style>

<script id="zoey-final-control-plane">
(function(){
  if(window.__zoeyFinalControlPlaneInstalled)return;
  window.__zoeyFinalControlPlaneInstalled=true;

  const escText = (v)=>String(v??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
  const escAttr = escText;
  const aliases={
    integrations:'plugins',
    Gmail:'Google Workspace',
    'Google Calendar':'Google Workspace',
    'Google Drive':'Google Workspace',
    'Google Docs':'Google Workspace',
    Gemini:'Google Gemini',
    Claude:'Anthropic / Claude'
  };
  const providers=[
    {name:'OpenAI',cat:'Model',auth:'api',description:'Primary model provider.'},
    {name:'Google Gemini',cat:'Model',auth:'api',description:'Gemini model provider and fallback route.'},
    {name:'ElevenLabs',cat:'Voice',auth:'api',description:'Text-to-speech for Zoey Voice.'},
    {name:'Anthropic / Claude',cat:'Model',auth:'api',description:'Claude model provider.'},
    {name:'DeepSeek',cat:'Model',auth:'api',description:'Model harness for reasoning, fallback routing, and agent-ready chat.'},
    {name:'Groq',cat:'Model',auth:'api',description:'Low-latency inference.'},
    {name:'OpenRouter',cat:'Model',auth:'api',description:'Multi-provider model routing.'},
    {name:'Tavily',cat:'Research',auth:'api',description:'Research search.'},
    {name:'Firecrawl',cat:'Research',auth:'api',description:'Web extraction.'},
    {name:'Google Workspace',cat:'Account',auth:'oauth',provider:'google',description:'Google account bridge with Calendar access.'},
    {name:'Microsoft Outlook',cat:'Productivity',auth:'oauth',provider:'microsoft',description:'Outlook account connector placeholder.'},
    {name:'Calendly',cat:'Scheduling',auth:'oauth',provider:'calendly',description:'Scheduling connector placeholder.'},
    {name:'Notion',cat:'Productivity',auth:'oauth',provider:'notion',description:'Notion connector placeholder.'},
    {name:'Slack',cat:'Communication',auth:'oauth',provider:'slack',description:'Slack connector placeholder.'},
    {name:'GitHub',cat:'Developer',auth:'oauth',provider:'github',description:'GitHub connector placeholder.'}
  ];

  function findProvider(name){
    const canonical=aliases[name]||name;
    return providers.find(p=>p.name===canonical)||null;
  }
  function state(){
    window.zoeyConnections=window.zoeyConnections||{providers:{},accounts:{}};
    window.zoeyConnections.providers=window.zoeyConnections.providers||{};
    window.zoeyConnections.accounts=window.zoeyConnections.accounts||{};
    return window.zoeyConnections;
  }
  function isConnected(name){
    const p=findProvider(name);if(!p)return false;const st=state();
    if(p.auth==='oauth')return !!st.accounts[p.provider||p.name]?.connected;
    return !!st.providers[p.name]?.configured;
  }
  function backendBaseFinal(){
    const configured=String(window.zoeySettings?.backendUrl||'').trim().replace(/\/+$/,'');
    if(configured)return configured.endsWith('/api')?configured:(configured+'/api');
    const host=location.hostname||'localhost';
    if(location.port==='8787')return location.origin+'/api';
    return `http://${host}:8787/api`;
  }
  /* This control plane is a separate IIFE, so it owns its own session helpers. */
  const FINAL_SESSION_KEY='zoeyBackendSession';
  function getBackendSessionFinal(){try{return sessionStorage.getItem(FINAL_SESSION_KEY)||localStorage.getItem(FINAL_SESSION_KEY)||''}catch{return ''}}
  function setBackendSessionFinal(id){if(!id)return;try{sessionStorage.setItem(FINAL_SESSION_KEY,id);localStorage.setItem(FINAL_SESSION_KEY,id)}catch{}}
  function captureBackendSessionFinal(res){const id=res.headers.get('X-Zoey-Session');if(id)setBackendSessionFinal(id)}
  async function api(path,options={}){
    const url=backendBaseFinal()+path;
    const sessionId=getBackendSessionFinal();
    const response=await fetch(url,{credentials:'include',...options,headers:{Accept:'application/json',...(options.body?{'Content-Type':'application/json'}:{}),...(sessionId?{'X-Zoey-Session':sessionId}:{}),...(options.headers||{})}});
    captureBackendSessionFinal(response);
    const type=response.headers.get('content-type')||'';
    const data=type.includes('application/json')?await response.json().catch(()=>({})):{};
    if(!response.ok)throw new Error(data?.error||`${response.status} ${response.statusText}`);
    return data;
  }
  window.zoeyFinalAPI={
    base:backendBaseFinal,
    health:()=>api('/health'),
    save:(provider,payload)=>api('/connections/save',{method:'POST',body:JSON.stringify({provider,...payload})}),
    test:(provider,payload)=>api('/providers/test',{method:'POST',body:JSON.stringify({provider,...payload})}),
    chat:(payload)=>api('/zoey/chat',{method:'POST',body:JSON.stringify(payload)}),
    tts:(payload)=>api('/zoey/chat',{method:'POST',body:JSON.stringify(payload)}),
    calendar:()=>api('/calendar/today')
  };

  function setStatus(text,kind=''){const el=document.getElementById('finalModalResult');if(!el)return;el.className='result'+(kind?' '+kind:'');el.textContent=text}
  function markPlugin(button,name){
    if(!button)return;button.classList.toggle('connected',isConnected(name));
    const s=button.querySelector('[data-final-state]');if(s)s.textContent=isConnected(name)?'CONNECTED':(findProvider(name)?.auth==='oauth'?'SIGN IN':'CONNECT');
  }
  function refreshFinalControls(){
    document.querySelectorAll('[data-final-provider]').forEach(b=>{const n=b.dataset.finalProvider;markPlugin(b,n);const s=b.querySelector('.final-provider-state');if(s)s.textContent=isConnected(n)?'CONNECTED': 'NOT SET'});
    document.querySelectorAll('[data-final-plugin]').forEach(b=>markPlugin(b,b.dataset.finalPlugin));
    const st=state();
    const count=Object.values(st.providers).filter(v=>v?.configured).length+Object.values(st.accounts).filter(v=>v?.connected).length;
    document.querySelectorAll('[data-final-count]').forEach(x=>x.textContent=String(count));
  }

  async function hydrate(){
    try{
      const h=await window.zoeyFinalAPI.health();
      if(h?.providers)for(const [name,meta] of Object.entries(h.providers))if(meta?.configured)state().providers[name]={configured:true,voiceId:String(meta.voiceId||'')};
      if(h?.google?.connected)state().accounts.google={connected:true,email:h.google.email||'',services:h.google.services||['Calendar']};
      refreshFinalControls();
    }catch{}
  }

  function pageHeadFinal(eyebrow,title,copy){return `<div class="head-row"><div><div class="eyebrow">${escText(eyebrow)}</div><h1 class="title">${escText(title)}</h1><div class="subtitle">${escText(copy)}</div></div></div>`}
  function providerMark(name){return name==='Google Workspace'?'G':name==='ElevenLabs'?'11':name.slice(0,2).toUpperCase()}

  function openProvider(name){
    const p=findProvider(name);if(!p)return;
    const st=state();const connected=isConnected(p.name);const saved=st.providers[p.name]||{};const googleAccount=st.accounts.google||{};
    const google=p.auth==='oauth'&&p.provider==='google';
    const modal=document.getElementById('modalHost');if(!modal)return;
    if(google){
      modal.innerHTML=`<div class="modal-backdrop no-overlay final-modal" id="finalProviderModal"><div class="modal">
        <div class="modal-head"><div><div class="modal-title">GOOGLE CALENDAR BRIDGE</div><div class="integration-small" style="margin-top:5px">${connected?'CONNECTED':'ACCOUNT CONNECTION'} · CALENDAR</div></div><button class="x" data-final-close>×</button></div>
        <div class="integration-detail"><div class="oauth-logo">G</div><div><b>Google Workspace</b><div class="integration-small">${escText(googleAccount.email||'Sign in to connect Google Calendar')}</div></div></div>
        <div class="final-bridge" style="margin-top:14px"><div class="final-bridge-side"><div class="final-bridge-title">SYSTEM CALENDAR</div><div class="final-bridge-value">Zoey Calendar</div><div class="final-bridge-copy">This is the calendar surface inside the workspace.</div></div><div class="final-bridge-arrow">⇄</div><div class="final-bridge-side"><div class="final-bridge-title">EXTERNAL CALENDAR</div><div class="final-bridge-value">Google Calendar</div><div class="final-bridge-copy">Events are read/written through the server-side Google OAuth connection.</div></div></div>
        <div class="secure-note" style="margin-top:13px">Google handles the sign-in and consent. Zoey receives the authorized account and connects Calendar automatically.</div>
        <div class="modal-foot"><button class="btn" data-final-close>CANCEL</button><button class="btn primary" id="finalGoogleConnect">${connected?'RECONNECT WITH GOOGLE':'CONTINUE WITH GOOGLE'}</button></div>
        <div id="finalModalResult" class="result" aria-live="polite">${connected?'Google Calendar is connected.':'Google Calendar is not connected yet.'}</div>
      </div></div>`;
      document.getElementById('finalGoogleConnect')?.addEventListener('click',()=>startGoogleOAuth());
      return;
    }
    const hasKey=!!saved.configured;
    const eleven=p.name==='ElevenLabs';
    modal.innerHTML=`<div class="modal-backdrop no-overlay final-modal" id="finalProviderModal"><div class="modal">
      <div class="modal-head"><div><div class="modal-title">${escText(p.name.toUpperCase())}</div><div class="integration-small" style="margin-top:5px">${escText(p.cat.toUpperCase())} · ${connected?'CONNECTED':'NOT CONNECTED'}</div></div><button class="x" data-final-close>×</button></div>
      <div class="integration-detail"><div class="integration-mark">${escText(providerMark(p.name))}</div><div><b>${escText(p.name)}</b><div class="integration-small">${escText(p.description)}</div></div></div>
      <div class="field"><label>API KEY</label><input id="finalProviderKey" type="password" autocomplete="new-password" placeholder="${hasKey?'Saved key is on the backend — enter a new key to replace it':'Paste your API key'}"></div>
      ${eleven?`<div class="field"><label>VOICE ID</label><input id="finalVoiceId" value="${escAttr(saved.voiceId||'')}" placeholder="ElevenLabs voice ID"></div>`:''}
      <div class="hint">Save sends the secret only to the configured Zoey backend. Browser storage is not used for the key. TEST CONNECTION uses the backend adapter.</div>
      <div class="modal-foot"><button class="btn" data-final-close>CANCEL</button>${connected?'<button class="btn danger" id="finalDisconnect">DISCONNECT</button>':''}<button class="btn" id="finalTest">TEST CONNECTION</button>${eleven?'<button class="btn" id="finalVoiceTest">TEST VOICE</button>':''}<button class="btn primary" id="finalSave">${connected?'REPLACE KEY':'CONNECT'}</button></div>
      <div id="finalModalResult" class="result" aria-live="polite">${hasKey?'A backend connection exists for this provider.':'Enter a key to connect this provider.'}</div>
    </div></div>`;
    document.getElementById('finalProviderKey')?.focus();

    document.getElementById('finalSave')?.addEventListener('click',async()=>{
      const key=document.getElementById('finalProviderKey')?.value?.trim()||'';const voiceId=document.getElementById('finalVoiceId')?.value?.trim()||saved.voiceId||'';
      if(!key){setStatus(hasKey?'No new key entered. Use TEST CONNECTION with the saved backend key, or enter a replacement key.':'Enter the API key first.','err');return}
      setStatus('Saving through backend…');
      try{await window.zoeyFinalAPI.save(p.name,{key,voiceId});state().providers[p.name]={...(state().providers[p.name]||{}),configured:true,voiceId};setStatus('Connected. The key is held by the backend session.','ok');refreshFinalControls();window.refreshConnectionUI?.();window.refreshIntegrationUI?.();pushActivity?.('CONNECTION',`${p.name} connected.`)}catch(err){setStatus(`Could not save: ${err.message}`,'err')}
    });
    document.getElementById('finalTest')?.addEventListener('click',async()=>{
      const key=document.getElementById('finalProviderKey')?.value?.trim()||'';const voiceId=document.getElementById('finalVoiceId')?.value?.trim()||saved.voiceId||'';
      setStatus('Testing through backend…');
      try{const r=await window.zoeyFinalAPI.test(p.name,{key,voiceId});setStatus(`Connection OK${r?.detail?` · ${r.detail}`:''}`,'ok')}catch(err){setStatus(`Connection test failed: ${err.message}`,'err')}
    });
    document.getElementById('finalVoiceTest')?.addEventListener('click',async()=>{
      const key=document.getElementById('finalProviderKey')?.value?.trim()||'';const voiceId=document.getElementById('finalVoiceId')?.value?.trim()||saved.voiceId||'';
      if(!voiceId){setStatus('Enter a Voice ID first.','err');return}
      setStatus('Generating voice test…');
      try{
        const savePayload={voiceId};if(key)savePayload.key=key;
        if(key)await window.zoeyFinalAPI.save(p.name,savePayload);
        if(key)state().providers[p.name]={...(state().providers[p.name]||{}),configured:true,voiceId};
        const d=await window.zoeyFinalAPI.tts({mode:'tts',provider:'ElevenLabs',text:'Hello. This is the Zoey voice connection test.',voiceId});
        if(!d?.audioUrl)throw new Error('No audio returned.');
        const audio=new Audio(d.audioUrl);await audio.play();setStatus('Voice test played successfully through ElevenLabs.','ok');refreshFinalControls();
      }catch(err){setStatus(`Voice test failed: ${err.message}`,'err')}
    });
    document.getElementById('finalDisconnect')?.addEventListener('click',async()=>{setStatus('Disconnecting…');try{await window.zoeyFinalAPI.save(p.name,{remove:true})}catch{}delete state().providers[p.name];setStatus('Disconnected from this browser session.','ok');refreshFinalControls();window.refreshConnectionUI?.();window.refreshIntegrationUI?.()});
  }

  function startGoogleOAuth(){
    const w=window.open(window.zoeyFinalAPI.base()+'/oauth/google/start?popup=1&return_origin='+encodeURIComponent(location.origin==='null'?'*':location.origin),'zoey-google-oauth','width=520,height=720');
    if(!w){setStatus('Popup blocked. Allow popups for this workspace and click Connect again.','err');return}
    setStatus('Google sign-in opened. Choose your account and approve Calendar access.');
  }

  window.addEventListener('message',e=>{
    if(e?.data?.type!=='zoey-oauth-complete')return;
    if(e.data.ok){state().accounts.google={connected:true,email:e.data.email||'',services:e.data.services||['Calendar']};setStatus('Google Calendar connected.','ok');refreshFinalControls();window.refreshConnectionUI?.();window.refreshIntegrationUI?.();window.renderCalendar?.();pushActivity?.('ACCOUNT CONNECTED',`${e.data.email||'Google account'} connected.`)}
    else{setStatus(`Google connection failed: ${e.data.error||'OAuth failed.'}`,'err')}
  });

  function connectionsPage(){
    const focus=['Google Gemini','ElevenLabs','OpenAI','Anthropic / Claude','DeepSeek','Groq','OpenRouter','Tavily','Firecrawl','Google Workspace','Microsoft Outlook','Calendly','Notion','Slack','GitHub'];
    return `<div class="page">${pageHeadFinal('Connections','Connections','Connect model APIs, voice services, and external accounts. This is the credential and account control plane.')}<div class="stack">
      <section class="card"><div class="card-head"><div><div class="card-label">CONNECTORS</div><div class="body-copy" style="margin:8px 0 0">API connectors store their secrets in the backend session. Account connectors use provider OAuth. Click any connector below to configure or test it.</div></div><span class="live-chip"><span class="status-dot"></span><span><span data-final-count>0</span> connected</span></span></div></section>
      <section class="card"><div class="card-head"><div class="card-label">API + ACCOUNT CONNECTIONS</div><span class="hint">CLICK TO CONNECT</span></div><div class="final-control-grid">${focus.map(n=>{const p=findProvider(n);const on=isConnected(n);return `<button type="button" class="final-provider-card ${on?'connected':''}" data-final-provider="${escAttr(n)}"><div class="final-provider-top"><div class="final-provider-mark">${escText(providerMark(n))}</div><span class="final-provider-state">${on?'CONNECTED':'NOT SET'}</span></div><div><div class="final-provider-name">${escText(n)}</div><div class="final-provider-meta">${escText(p?.cat||'Connector')}</div></div></button>`}).join('')}</div></section>
      <section class="card"><div class="card-head"><div class="card-label">GOOGLE CALENDAR BRIDGE</div><span class="hint">READ + WRITE</span></div><div class="final-bridge"><div class="final-bridge-side"><div class="final-bridge-title">ZOey SYSTEM CALENDAR</div><div class="final-bridge-value">Workspace Calendar</div><div class="final-bridge-copy">Your Zoey calendar UI stays the primary surface.</div></div><div class="final-bridge-arrow">⇄</div><div class="final-bridge-side"><div class="final-bridge-title">GOOGLE CALENDAR</div><div class="final-bridge-value">${isConnected('Google Workspace')?'CONNECTED':'NOT CONNECTED'}</div><div class="final-bridge-copy">Connect Google once; Zoey can then load today’s events and create events on the primary calendar.</div></div></div><div class="modal-foot" style="justify-content:flex-start"><button type="button" class="btn primary" data-final-google>${isConnected('Google Workspace')?'RECONNECT GOOGLE CALENDAR':'CONNECT GOOGLE CALENDAR'}</button><button type="button" class="btn" data-final-home-calendar>OPEN CALENDAR</button></div></section>
      </div></div>`;
  }
  function pluginsPage(){
    const list=['Google Workspace','Google Calendar','Gmail','Google Drive','OpenAI','Google Gemini','ElevenLabs','Notion','Slack','GitHub','Microsoft Outlook','Calendly'];
    return `<div class="page">${pageHeadFinal('Plugins','Plugins','Plugins are the services Zoey can call. Connections holds their credentials and account authorization; Plugins exposes the capabilities.')}<section class="card"><div class="card-head"><div class="card-label">PLUGIN CATALOG</div><span class="hint">CAPABILITIES</span></div><div class="final-plugin-grid">${list.map(n=>{const canonical=aliases[n]||n;const p=findProvider(canonical);const on=isConnected(canonical);return `<button type="button" class="final-plugin-tile ${on?'connected':''}" data-final-plugin="${escAttr(canonical)}"><div class="final-plugin-logo">${escText(providerMark(canonical))}</div><div class="final-plugin-name">${escText(n)}</div><div class="final-plugin-state" data-final-state>${on?'CONNECTED':(p?.auth==='oauth'?'SIGN IN':'CONNECT')}</div></button>`}).join('')}</div></section>
    <section class="card" style="margin-top:12px"><div class="card-head"><div class="card-label">PLUGIN / CONNECTION SPLIT</div></div><div class="body-copy" style="margin:0">Plugins define what Zoey can use. Connections define how Zoey is authorized to use it. API keys, OAuth tokens, and provider credentials never belong in the plugin catalog itself.</div></section></div>`;
  }
  views.connections=connectionsPage;
  views.plugins=pluginsPage;
  views.integrations=pluginsPage;

  const realRender=window.render;
  if(typeof realRender==='function'){
    window.render=function(view='home'){
      const target=aliases[view]||view;
      realRender(target);
      setTimeout(()=>{refreshFinalControls();},0);
    };
  }

  function routeView(view){
    const target=aliases[view]||view;
    if(typeof window.render!=='function')return;
    if(window.currentView===target){refreshFinalControls();return}
    try{history.pushState({},'',`?view=${encodeURIComponent(target)}`)}catch{}
    window.render(target);
  }

  // One capture router. It stops the older delegated handlers before they can re-render the page
  // or intercept these same clicks.
  window.addEventListener('click',function(e){
    const nav=e.target.closest?.('#nav button[data-view], .bottom-stack button[data-view]');
    if(nav){e.preventDefault();e.stopImmediatePropagation();routeView(nav.dataset.view);return}
    const card=e.target.closest?.('[data-final-provider]');
    if(card){e.preventDefault();e.stopImmediatePropagation();openProvider(card.dataset.finalProvider);return}
    const plugin=e.target.closest?.('[data-final-plugin]');
    if(plugin){e.preventDefault();e.stopImmediatePropagation();openProvider(plugin.dataset.finalPlugin);return}
    if(e.target.closest?.('[data-final-google]')){e.preventDefault();e.stopImmediatePropagation();openProvider('Google Workspace');return}
    if(e.target.closest?.('[data-final-home-calendar]')){e.preventDefault();e.stopImmediatePropagation();routeView('home');setTimeout(()=>window.openUtility?.('calendar'),40);return}
    if(e.target.closest?.('[data-final-close]')||e.target.id==='finalProviderModal'){e.preventDefault();e.stopImmediatePropagation();document.getElementById('modalHost').innerHTML='';return}
  },true);

  // Normalize the visible sidebar now, not on the next render.
  const pluginNav=document.querySelector('#nav button[data-view="plugins"], #nav button[data-view="integrations"]');
  if(pluginNav){pluginNav.dataset.view='plugins';pluginNav.title='Plugins';pluginNav.setAttribute('aria-label','Plugins')}
  document.querySelectorAll('#nav button[data-view]').forEach(b=>b.title||(b.title=b.getAttribute('aria-label')||''));

  // Refresh explicitly after canonical renders; do not observe body mutations here.
  // Observing body while refreshFinalControls mutates classes/text creates an infinite mutation loop.
  setTimeout(()=>{hydrate();refreshFinalControls()},0);
})();
</script>


<script id="zoey-voice-agent-controller">
/* Final voice controller: Ctrl+Space arms the microphone once; later turns are wake-word driven.
   Voice output is ElevenLabs-only when configured, preserving the selected Voice ID. */
(function(){
  if(window.__zoeyVoiceAgentController)return;
  window.__zoeyVoiceAgentController=true;

  const WAKE_RE=/\b(?:wake\s+up\s+)?(?:zoe|zoey)\b/i;
  const WAKE_FULL_RE=/\b(?:wake\s+up\s+zoe|wake\s+up\s+zoey|hey\s+zoe|hey\s+zoey)\b/i;
  const SESSION_KEY='zoeyBackendSession';
  const V=window.__zoeyVoiceAgent={armed:false,mode:'off',recognition:null,audio:null,audioUrl:null,starting:false,speaking:false,lastTranscript:''};

  function getSession(){try{return localStorage.getItem(SESSION_KEY)||sessionStorage.getItem(SESSION_KEY)||''}catch{return ''}}
  function setSession(id){if(!id)return;try{localStorage.setItem(SESSION_KEY,id);sessionStorage.setItem(SESSION_KEY,id)}catch{}}
  function base(){
    const configured=String(window.zoeySettings?.backendUrl||'').trim().replace(/\/+$/,'');
    if(configured)return configured.endsWith('/api')?configured:(configured+'/api');
    const host=location.hostname||'localhost';
    if(location.port==='8787')return location.origin+'/api';
    return `http://${host}:8787/api`;
  }
  async function request(path,opts={}){
    const headers={'Accept':'application/json',...(opts.body?{'Content-Type':'application/json'}:{}),...(getSession()?{'X-Zoey-Session':getSession()}:{}),...(opts.headers||{})};
    const r=await fetch(base()+path,{credentials:'include',...opts,headers});
    const sid=r.headers.get('X-Zoey-Session');if(sid)setSession(sid);
    return r;
  }
  async function jsonRequest(path,opts={}){
    const r=await request(path,opts);const d=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(d?.error||`${r.status} ${r.statusText}`);return d;
  }
  async function health(){return await jsonRequest('/health')}
  async function syncProviderState(){
    try{
      const h=await health();
      window.zoeyConnections=window.zoeyConnections||{providers:{},accounts:{}};
      window.zoeyConnections.providers=window.zoeyConnections.providers||{};
      if(h?.providers)for(const [name,meta] of Object.entries(h.providers)){
        if(meta?.configured)window.zoeyConnections.providers[name]={...(window.zoeyConnections.providers[name]||{}),configured:true,voiceId:String(meta.voiceId||window.zoeyConnections.providers[name]?.voiceId||'')};
      }
      if(h?.google?.connected){window.zoeyConnections.accounts=window.zoeyConnections.accounts||{};window.zoeyConnections.accounts.google={connected:true,email:h.google.email||'',services:h.google.services||['Calendar']}}
      window.refreshConnectionUI?.();window.refreshIntegrationUI?.();
      return h;
    }catch{return null}
  }
  function setState(name){try{window.setOrbState?.(name)}catch{}; try{window.dispatchEvent(new CustomEvent('zoey:voice-agent-state',{detail:{state:name}}))}catch{}}
  function activeVoice(){return window.zoeyConnections?.providers?.ElevenLabs||null}
  function stopAudio(){
    try{V.audio?.pause()}catch{};V.audio=null;V.speaking=false;
    if(V.audioUrl){try{URL.revokeObjectURL(V.audioUrl)}catch{};V.audioUrl=null}
  }

  async function playAudioResponse(response){
    const type=response.headers.get('content-type')||'audio/mpeg';
    /* Prefer incremental playback when Chromium exposes an MP3 MediaSource. */
    if(response.body && window.MediaSource && MediaSource.isTypeSupported?.('audio/mpeg')){
      const audio=new Audio();audio.preload='auto';
      const ms=new MediaSource();const url=URL.createObjectURL(ms);V.audio=audio;V.audioUrl=url;audio.src=url;
      const done=new Promise((resolve,reject)=>{
        let sb=null,reader=null,ended=false,started=false;const queue=[];let pumping=false;
        const finish=()=>{if(ended)return;ended=true;V.speaking=false;try{URL.revokeObjectURL(url)}catch{};V.audio=null;V.audioUrl=null;resolve()};
        audio.onended=finish;audio.onerror=()=>reject(new Error('Audio playback failed.'));
        function pump(){
          if(!sb||pumping||!queue.length)return;
          pumping=true;
          try{sb.appendBuffer(queue.shift());}catch(e){pumping=false;reject(e)}
        }
        ms.addEventListener('sourceopen',async()=>{
          try{sb=ms.addSourceBuffer('audio/mpeg');sb.mode='sequence';sb.addEventListener('updateend',()=>{pumping=false;pump();});reader=response.body.getReader();
            while(true){const {done,value}=await reader.read();if(done)break;queue.push(value);pump();if(!started){started=true;try{await audio.play()}catch{}}}
            const wait=()=>{if(!sb.updating && queue.length===0 && ms.readyState==='open'){try{ms.endOfStream()}catch{}return}setTimeout(wait,15)};wait();
          }catch(e){reject(e)}
        },{once:true});
      });
      try{await done;return}catch{}
    }
    const blob=await response.blob();
    const audio=new Audio();audio.preload='auto';const url=URL.createObjectURL(new Blob([blob],{type:type||'audio/mpeg'}));
    V.audio=audio;V.audioUrl=url;audio.src=url;
    await audio.play();
    await new Promise((resolve,reject)=>{audio.onended=resolve;audio.onerror=()=>reject(new Error('Audio playback failed.'))});
    stopAudio();
  }

  async function speakSelectedVoice(text){
    if(!text)return;
    let voice=activeVoice();
    if(!voice?.configured || !voice?.voiceId){await syncProviderState();voice=activeVoice()}
    if(!voice?.configured)throw new Error('ElevenLabs is not connected.');
    if(!voice.voiceId)throw new Error('No ElevenLabs Voice ID is configured.');
    stopAudio();V.speaking=true;setState('speaking');
    const r=await request('/voice/stream',{method:'POST',body:JSON.stringify({text:String(text).slice(0,5000),voiceId:voice.voiceId})});
    if(!r.ok){const d=await r.json().catch(()=>({}));V.speaking=false;setState('error');throw new Error(d?.error||`${r.status} ${r.statusText}`)}
    await playAudioResponse(r);setState('idle');
  }
  window.zoeySpeakSelectedVoice=speakSelectedVoice;

  function stopRecognition(){try{V.recognition?.abort()}catch{};V.recognition=null}
  function transcriptFromEvent(e){return [...e.results].map(r=>r[0]?.transcript||'').join(' ').trim()}
  function wakeOnly(text){
    const m=text.match(WAKE_FULL_RE)||text.match(/^(?:\s*)(?:zoe|zoey)\b/i);return !!m;
  }
  function commandAfterWake(text){
    return text.replace(/^\s*(?:wake\s+up\s+)?(?:zoe|zoey)\s*[,;:\-]?\s*/i,'').trim();
  }

  function startWakeRecognition(){
    if(!V.armed)return;
    const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!Recognition){setState('error');window.dispatchEvent(new CustomEvent('zoey:voice-error',{detail:{message:'Speech recognition is not available in this browser.'}}));return}
    stopRecognition();
    const rec=new Recognition();rec.lang=navigator.language||'en-US';rec.continuous=true;rec.interimResults=true;rec.maxAlternatives=1;
    rec.onresult=e=>{
      if(!V.armed||V.mode!=='wake'||V.speaking)return;
      const text=transcriptFromEvent(e);if(!text||text===V.lastTranscript)return;V.lastTranscript=text;
      if(wakeOnly(text)){
        const command=commandAfterWake(text);
        if(command){stopRecognition();handleVoiceTurn(command);}
        else captureCommand();
      }
    };
    rec.onerror=e=>{if(!V.armed)return; if(e?.error==='not-allowed'){setState('error');return}setTimeout(startWakeRecognition,250)};
    rec.onend=()=>{if(V.armed&&V.mode==='wake'&&!V.speaking)setTimeout(startWakeRecognition,250)};
    V.recognition=rec;V.mode='wake';setState('idle');
    try{rec.start()}catch{setTimeout(startWakeRecognition,250)}
  }

  function captureCommand(){
    if(!V.armed)return;
    stopRecognition();V.mode='command';setState('listening');V.lastTranscript='';
    const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Recognition)return;
    const rec=new Recognition();rec.lang=navigator.language||'en-US';rec.continuous=false;rec.interimResults=true;rec.maxAlternatives=1;let finalText='';
    rec.onresult=e=>{const t=transcriptFromEvent(e);if(t)finalText=t;if([...e.results].some(r=>r.isFinal)&&finalText)handleVoiceTurn(finalText)};
    rec.onerror=()=>{V.mode='wake';setState('idle');setTimeout(startWakeRecognition,150)};
    rec.onend=()=>{if(V.mode==='command'){if(finalText)handleVoiceTurn(finalText);else{V.mode='wake';setTimeout(startWakeRecognition,150)}}};
    V.recognition=rec;try{rec.start()}catch{setTimeout(captureCommand,150)}
  }

  async function handleVoiceTurn(text){
    const value=String(text||'').trim();if(!value){V.mode='wake';startWakeRecognition();return}
    stopRecognition();V.mode='processing';V.lastTranscript=value;setState('thinking');
    try{window.appendChatMessage?.('You',value,'user');window.pushActivity?.('VOICE',`J.A.R.V.I.S. Core is routing this request.`)}catch{}
    try{
      const data=await jsonRequest('/zoey/chat',{method:'POST',body:JSON.stringify({message:value,voice:true})});
      const answer=String(data.answer||'').trim();if(!answer)throw new Error('The model returned no spoken response.');
      try{window.appendChatMessage?.('Zoey',answer,'route');window.pushActivity?.('AGENT',`${data.route||'J.A.R.V.I.S. Core'}${data.agent?' · '+data.agent:''}`)}catch{}
      await speakSelectedVoice(answer);
    }catch(err){
      const msg=err?.message||'Voice request failed.';
      try{window.appendChatMessage?.('System',msg,'route');window.pushActivity?.('VOICE ERROR',msg)}catch{}
      stopAudio();setState('error');
    }finally{
      if(V.armed){V.mode='wake';setTimeout(startWakeRecognition,250)}else{V.mode='off';setState('idle')}
    }
  }

  async function arm(){
    if(V.starting)return;V.starting=true;
    try{
      await syncProviderState();
      const voice=activeVoice();if(!voice?.configured||!voice?.voiceId)throw new Error('Connect ElevenLabs and set its Voice ID before starting Zoe Voice.');
      if(!navigator.mediaDevices?.getUserMedia)throw new Error('Microphone access is not available in this browser.');
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      stream.getTracks().forEach(t=>t.stop());
      V.armed=true;V.mode='wake';V.lastTranscript='';
      setState('idle');window.pushActivity?.('VOICE','Zoe is armed and listening for “wake up Zoe”.');
      startWakeRecognition();
    }catch(err){
      V.armed=false;V.mode='off';setState('error');window.pushActivity?.('VOICE ERROR',err?.message||'Could not start Zoe Voice.');
    }finally{V.starting=false}
  }
  function disarm(){V.armed=false;V.mode='off';stopRecognition();stopAudio();setState('idle');window.pushActivity?.('VOICE','Zoe Voice stopped.')}
  function toggle(){if(V.speaking){stopAudio();V.armed=true;V.mode='command';captureCommand();return}if(!V.armed)arm()}
  window.startZoeyListening=arm;window.stopZoeyListening=disarm;window.toggleZoeyVoice=toggle;

  window.addEventListener('keydown',e=>{
    if(!(e.ctrlKey&&e.code==='Space')||e.repeat||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;
    e.preventDefault();e.stopImmediatePropagation();
    if(!V.armed)arm();
  },true);

  document.addEventListener('zoey:voice-state',()=>{});
  syncProviderState();
})();
</script>
</body>
